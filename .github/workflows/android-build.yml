name: React Native Android Build

on:
  push:
    branches: ['main']

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Create .env.production file from secrets
      - name: Create env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" >> .env.production
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env.production

      # 5. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Build APK / AAB
      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ENVFILE=../.env.production ./gradlew assembleProductionRelease bundleProductionRelease

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/production/release/*.apk

      # 8. Upload AAB (Play Store)
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/productionRelease/*.aab
